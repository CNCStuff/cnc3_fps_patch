name: Build DLL

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - Makefile
      - fps_patch.ini.example
      - .github/workflows/build.yml
  pull_request:
    paths:
      - src/**
      - Makefile
      - fps_patch.ini.example
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Build
        run: make release

      - name: Prepare downloadable files
        run: |
          mkdir -p dist
          cp zig-out/bin/dinput8.dll dist/dinput8.dll
          cp fps_patch.ini.example dist/fps_patch.ini
          cd dist
          zip -9 fps_patch.zip dinput8.dll fps_patch.ini
          rm dinput8.dll fps_patch.ini
          git show -s --format=%s "$GITHUB_SHA" > release-commit-subject.txt

      - name: Upload commit artifact
        uses: actions/upload-artifact@v7
        with:
          name: fps_patch-${{ github.sha }}
          path: |
            dist/fps_patch.zip
            dist/release-commit-subject.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish build release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: fps_patch-${{ github.sha }}
          path: dist

      - name: Publish build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          release_tag="build-${short_sha}"
          build_date="$(date -u '+%Y-%m-%d %H:%M UTC')"
          commit_subject="$(cat dist/release-commit-subject.txt)"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; nothing to publish."
            exit 0
          fi

          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${build_date}" \
            --notes "Commit: ${commit_subject}

          Commit hash: \`$GITHUB_SHA\`" \
            --latest \
            dist/fps_patch.zip
