name: Build DLL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Build
        run: make release

      - name: Prepare downloadable files
        run: |
          mkdir -p dist
          cp zig-out/bin/dinput8.dll dist/dinput8.dll
          cp fps_patch.ini.example dist/fps_patch.ini
          cd dist
          zip -9 fps_patch.zip dinput8.dll fps_patch.ini
          rm dinput8.dll fps_patch.ini

      - name: Upload commit artifact
        uses: actions/upload-artifact@v7
        with:
          name: fps_patch-${{ github.sha }}
          path: dist/fps_patch.zip
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish latest build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: continuous-release
      cancel-in-progress: false

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: fps_patch-${{ github.sha }}
          path: dist

      - name: Refresh latest build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping release because main has advanced to $head_sha"
            exit 0
          fi

          # Recreate instead of editing so GitHub shows this build's date.
          gh release delete continuous \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes 2>/dev/null || true

          gh release create continuous \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest automated build" \
            --notes "Automated build of commit \`$GITHUB_SHA\`." \
            --latest \
            dist/fps_patch.zip
